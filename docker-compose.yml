services:
  cluster-master:
    image: firasj/spark-docker-cluster
    #platform: linux/amd64
    container_name: cluster-master
    ports:
      - "8088:8088"
      - "4040:4040"
      - "19888:19888"
      - "9000:9000"
      - "9870:9870"
    volumes:
      - "./app:/app"
    networks:
      - spark-cluster
    depends_on:
      - cluster-slave-1
      - scylladb-server
    hostname: cluster-master
    tty: true
    working_dir: /app
    # You can comment the entrypoint to run the script manually inside the container
    entrypoint: 
      - bash
      - /app/app.sh
    
  cluster-slave-1:
    image: firasj/spark-docker-cluster
    #platform: linux/amd64 
    container_name: cluster-slave-1
    networks:
      - spark-cluster
    hostname: cluster-slave-1
    tty: true

  scylladb-server:
    image: scylladb/scylla:5.2
    #platform: linux/amd64
    container_name: scylladb-server
    ports:
      - "9042:9042" 
    networks:
      - spark-cluster
    

networks:
  spark-cluster:
    driver: bridge